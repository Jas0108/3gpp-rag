<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3GPP 5G Standards Assistant</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header / Navbar -->
    <header class="navbar">
      <div class="brand">
        <div class="logo-icon">📡</div>
        <div class="brand-text">
          <h1>3GPP Standards Assistant</h1>
          <p class="subtitle">3GPP TS 23.501 V18.12.0 • 5G System Architecture</p>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Input Card -->
      <section class="search-card">
        <label for="question-input" class="search-label">Ask a technical question about 5G specifications:</label>
        <div class="input-wrapper">
          <textarea id="question-input" placeholder="e.g. What is the role of the Access and Mobility Management Function (AMF)?" rows="3"></textarea>
          <button id="send-btn" class="send-button" title="Send Question">
            <span>Ask</span>
            <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>

        <!-- Sample Prompts -->
        <div class="sample-prompts">
          <span class="prompt-title">Try asking:</span>
          <button class="prompt-chip" data-query="Tell me about UE radio Capability Management Function (UCMF)">Tell me about UE radio Capability Management Function (UCMF)</button>
          <button class="prompt-chip" data-query="What are the Principles for Binding, Selection and Reselection?">What are the Principles for Binding, Selection and Reselection?</button>
          <button class="prompt-chip" data-query="Tell me about Maximum Packet Loss Rate">Tell me about Maximum Packet Loss Rate</button>
        </div>
      </section>

      <!-- Response Container -->
      <section id="response-container" class="response-section hidden">
        <!-- Loading Spinner -->
        <div id="loading-state" class="loading-card hidden">
          <div class="spinner"></div>
          <p>Searching 3GPP TS 23.501 specification & verifying evidence...</p>
        </div>

        <!-- Output Card -->
        <div id="output-card" class="output-card hidden">
          <div class="card-header">
            <div class="card-title">
              <span id="response-icon" class="response-icon">💡</span>
              <span id="response-status-title">Grounded Answer</span>
            </div>
            <div class="card-meta">
              <span id="elapsed-time" class="meta-pill">⚡ 0.0s</span>
              <button id="copy-btn" class="icon-btn" title="Copy Answer">📋 Copy</button>
            </div>
          </div>

          <!-- Answer Body -->
          <div id="answer-body" class="answer-body"></div>

          <!-- Citations Section -->
          <div id="citations-section" class="citations-section hidden">
            <h4>📄 Verified Source Citations</h4>
            <div id="citations-list" class="citations-list"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
